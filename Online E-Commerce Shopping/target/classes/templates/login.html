<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><head><title>Login</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
    <div class="bg-white p-8 rounded shadow-xl w-96">
        <h2 class="text-2xl font-bold text-center mb-6">Login</h2>
        <form th:action="@{/login}" method="post" class="space-y-4">
            <input type="email" name="username" class="w-full p-2 border rounded" placeholder="Email" required>
            <input type="password" name="password" class="w-full p-2 border rounded" placeholder="Password" required>
            <button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded">Sign In</button>
        </form>
        <p class="text-center mt-4 text-sm">Need an account? <a href="/register" class="text-indigo-600">Register</a></p>
    </div>
</body></html>
