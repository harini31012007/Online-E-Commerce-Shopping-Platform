<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><head><title>Register</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
    <div class="bg-white p-8 rounded shadow-xl w-96">
        <h2 class="text-2xl font-bold text-center mb-6">Register</h2>
        <p class="text-xs text-gray-500 mb-4 text-center">Note: Include "admin" in your email to get Admin rights!</p>
        <form th:action="@{/register}" method="post" class="space-y-4">
            <input type="text" name="fullName" class="w-full p-2 border rounded" placeholder="Full Name" required>
            <input type="email" name="email" class="w-full p-2 border rounded" placeholder="Email (e.g. admin@test.com)" required>
            <input type="password" name="password" class="w-full p-2 border rounded" placeholder="Password" required>
            <button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded">Register</button>
        </form>
    </div>
</body></html>
