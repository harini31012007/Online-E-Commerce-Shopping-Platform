<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><head><title>User Profile</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-gray-50">
    <nav class="bg-indigo-600 text-white p-4"><div class="container mx-auto flex justify-between"><a href="/" class="text-2xl font-bold">☕ JavaStore</a></div></nav>
    <div class="container mx-auto py-10 px-4 max-w-4xl">
        <!-- USER PROFILE -->
        <h1 class="text-3xl font-bold mb-4">My Profile</h1>
        <div class="bg-white p-6 rounded shadow mb-8">
            <p><strong>Name:</strong> <span th:text="${user.fullName}">Name</span></p>
            <p><strong>Email:</strong> <span th:text="${user.email}">Email</span></p>
            <p><strong>Role:</strong> <span th:text="${user.role}">Role</span></p>
        </div>
        <!-- ORDER HISTORY -->
        <h2 class="text-2xl font-bold mb-4">Order History</h2>
        <div class="bg-white rounded shadow">
            <table class="w-full text-left">
                <tr class="bg-gray-100"><th class="p-4">Order ID</th><th class="p-4">Date</th><th class="p-4">Total</th><th class="p-4">Status</th></tr>
                <tr th:each="order : ${orders}" class="border-b">
                    <td class="p-4">#<span th:text="${order.id}"></span></td>
                    <td class="p-4" th:text="${#temporals.format(order.orderDate, 'dd-MM-yyyy HH:mm')}">Date</td>
                    <td class="p-4" th:text="'$' + ${order.totalAmount}">$0</td>
                    <td class="p-4 font-bold text-indigo-600" th:text="${order.status}">Status</td>
                </tr>
                <tr th:if="${#lists.isEmpty(orders)}"><td colspan="4" class="p-4 text-center">No past orders.</td></tr>
            </table>
        </div>
    </div>
</body></html>
