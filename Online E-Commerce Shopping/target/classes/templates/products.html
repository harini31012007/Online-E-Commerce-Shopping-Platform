<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><head><title>Products</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-gray-50">
    <nav class="bg-indigo-600 text-white p-4"><div class="container mx-auto flex justify-between"><a href="/" class="text-2xl font-bold">☕ JavaStore</a><a href="/cart">Cart 🛒</a></div></nav>
    <div class="container mx-auto py-10 px-4">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold">Products</h1>
            <!-- SEARCH BAR -->
            <form th:action="@{/products}" method="get" class="flex gap-2">
                <input type="text" name="search" th:value="${searchQuery}" placeholder="Search products..." class="border p-2 rounded w-64">
                <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded">Search</button>
            </form>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-4 gap-6">
            <div th:each="product : ${products}" class="bg-white p-4 rounded-lg shadow">
                <h3 class="font-bold text-lg" th:text="${product.name}">Name</h3>
                <p class="text-gray-500 text-sm mb-2" th:text="${product.category}">Category</p>
                <p class="text-indigo-600 font-semibold mb-2" th:text="'$' + ${product.price}">$0</p>
                <form th:action="@{/cart/add}" method="post">
                    <input type="hidden" name="productId" th:value="${product.id}" />
                    <button type="submit" class="bg-gray-900 text-white px-4 py-2 rounded w-full">Add to Cart</button>
                </form>
            </div>
            <div th:if="${#lists.isEmpty(products)}" class="col-span-4 text-center text-gray-500">No products found.</div>
        </div>
    </div>
</body></html>
