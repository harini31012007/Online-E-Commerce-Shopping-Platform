<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><head><title>Cart</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-gray-50">
    <nav class="bg-indigo-600 text-white p-4"><div class="container mx-auto flex justify-between"><a href="/" class="text-2xl font-bold">☕ JavaStore</a><a href="/products">Products</a></div></nav>
    <div class="container mx-auto py-10 px-4 max-w-4xl">
        <h1 class="text-3xl font-bold mb-8">Cart</h1>
        <div class="bg-white rounded shadow p-6 text-center" th:if="${#lists.isEmpty(cart)}"><p>Empty.</p><a href="/products" class="text-indigo-600">Shop Now</a></div>
        <div class="bg-white rounded shadow" th:unless="${#lists.isEmpty(cart)}">
            <table class="w-full text-left">
                <tr class="bg-gray-100"><th class="p-4">Item</th><th class="p-4">Price</th><th class="p-4">Action</th></tr>
                <tr th:each="item : ${cart}" class="border-b">
                    <td class="p-4" th:text="${item.product.name}">Name</td>
                    <td class="p-4" th:text="'$' + ${item.product.price}">$0</td>
                    <td class="p-4">
                        <form th:action="@{/cart/remove}" method="post">
                            <input type="hidden" name="itemId" th:value="${item.id}">
                            <button type="submit" class="text-red-500">Remove</button>
                        </form>
                    </td>
                </tr>
            </table>
            <div class="p-6 bg-gray-50">
                <div class="text-xl font-bold mb-4">Total: $<span th:text="${total}">0</span></div>
                <form th:action="@{/checkout}" method="post">
                    <textarea name="address" required class="w-full border p-2 rounded mb-4" placeholder="Shipping Address"></textarea>
                    <button type="submit" class="bg-indigo-600 text-white px-6 py-2 rounded font-bold w-full">Proceed to Payment</button>
                </form>
            </div>
        </div>
    </div>
</body></html>
